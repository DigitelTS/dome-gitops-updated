api:
  replicaCount: 1
  image:
    repository: tir-api
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  ingress:
    enabled: true
    host: api.tir.infra.dome.dts.com
    paths: 
      - /v4
      - /
  env:
    PORT: 8080
    DB_PORT: 5432
    DB_DRIVER: org.postgresql.Driver
    ETH_PROVIDER: http://some.blockchain.rpc.dome.com
    AUTH_ISSUER: http://some.idp.endpoint.rpc.dome.com
    HOST_URL: http://api.infra.dome.dts.com
    API_URL: http://api.infra.dome.dts.com/v4
    DB_URL: jbdc:postgresql://tir-database
    AUTH_MANDATORS: VATES-B60645900;VATES-B47447560
  envSecrets:
    DB_NAME:
      secretName: database-secret
      secretKey: POSTGRES_DB
    DB_USER:
      secretName: database-secret
      secretKey: POSTGRES_USER
    DB_PASS:
      secretName: database-secret
      secretKey: POSTGRES_PASSWORD
    ETH_ADDRESS:
      secretName: blockchain-secret
      secretKey: ADDRESS
    ETH_KEY:
      secretName: blockchain-secret
      secretKey: KEY
    ETH_CONTRACT:
      secretName: blockchain-secret
      secretKey: CONTRACT

portal:
  replicaCount: 1
  image:
    repository: tir-portal
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: true
    host: portal.tir.infra.dome.dts.com
    path: /
  env:
    NUXT_PUBLIC_API_MAIN_URI: /v4
    NUXT_PUBLIC_API_HEALTH: /health
    NUXT_PUBLIC_CLIENT_ID: tir_portal_client_id
    NUXT_PUBLIC_API_HOST: http://api.infra.dome.dts.com
    NUXT_PUBLIC_AUTH_SERVER: http://some.verifier.dome.com
    NUXT_PUBLIC_TOKEN_SERVER: http://some.verifier.dome.com
    NUXT_PUBLIC_CODE_LENGTH: 64
    NUXT_PUBLIC_CODE_ALGO: SHA-256
    NUXT_PUBLIC_STATE_LENGTH: 16
    NUXT_PUBLIC_CHALLENGE_METHOD: S256
    NODE_ENV: development
    
